[project]
name = "devset"
version = "0.1.0"
description = "A Swiss-army-knife CLI with the everyday tools every dev reaches for."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Samarth Chugh (Sam3360)", email = "iforgot3360@gmail.com" },
]
requires-python = ">=3.8"
keywords = ["cli", "devtools", "utilities", "developer-tools"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # core - needed to run devset itself, and useful enough that every dev
    # ends up reaching for them anyway
    "click>=8.1.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "ipython>=8.20.0",
]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]
data = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "jupyter>=1.0.0",
    "openpyxl>=3.1.0",
]
all = [
    "devset[dev,web,data]",
]

[project.scripts]
devset = "devset.cli:main"

[project.urls]
Homepage = "https://github.com/Sam3360/devset"
Repository = "https://github.com/Sam3360/devset"
Issues = "https://github.com/Sam3360/devset/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["devset*"]
